services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: plas-postgres
    environment:
      POSTGRES_DB: plas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12@Batworld
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plas-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12@Batworld
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plas-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - plas-network

volumes:
  postgres_data:

networks:
  plas-network:
    driver: bridge
